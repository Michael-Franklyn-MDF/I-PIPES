      <a href="dashboard.html"  class="nav-item"><span class="nav-icon">▪</span> Dashboard</a>

      <a href="../logout.php" class="logout-link">Log out</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Run Evaluation</div>
        <div class="page-subtitle">Configure inputs and trigger a new policy evaluation.</div>
      </div>
    </div>

    <div class="card">
      <form id="form-run-evaluation">
        <div class="form-grid">
          <div class="form-group">
            <label for="policy">Policy <span style="color:var(--danger)">*</span></label>
            <select id="policy" name="policy">
              <option value="">Select a policy</option>
              <option value="National ICT Policy 2012">National ICT Policy 2012</option>
              <option value="Broadband Expansion Strategy">Broadband Expansion Strategy</option>
              <option value="Digital Inclusion Roadmap">Digital Inclusion Roadmap</option>
              <option value="Cybersecurity Framework">Cybersecurity Framework</option>
            </select>
          </div>

          <div class="form-group">
            <label for="period">Evaluation Period <span style="color:var(--danger)">*</span></label>
            <select id="period" name="period">
              <option value="">Select period</option>
              <option value="2024 (Annual)">2024 (Annual)</option>
              <option value="2023 (Annual)">2023 (Annual)</option>
              <option value="Q1 2025">Q1 2025</option>
              <option value="Q4 2024">Q4 2024</option>
              <option value="Q3 2024">Q3 2024</option>
            </select>
          </div>

          <div class="form-group">
            <label for="dataset">Data Source <span style="color:var(--danger)">*</span></label>
            <select id="dataset" name="dataset">
              <option value="">Select dataset</option>
              <option value="World Bank Open Data">World Bank Open Data</option>
              <option value="ITU ICT Indicators">ITU ICT Indicators</option>
              <option value="National Bureau of Statistics">National Bureau of Statistics</option>
              <option value="Custom uploaded dataset">Custom uploaded dataset</option>
            </select>
          </div>

          <div class="form-group">
            <label for="run_type">Run Type <span style="color:var(--danger)">*</span></label>
            <select id="run_type" name="run_type">
              <option value="">Select run type</option>
              <option value="Full evaluation">Full evaluation</option>
              <option value="Quick check">Quick check</option>
              <option value="Sensitivity analysis">Sensitivity analysis</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="notes">Evaluation Notes</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Optional context, assumptions, or questions for reviewers."></textarea>
          </div>
        </div>

        <div id="eval-error" class="error-msg"></div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:4px;">
          <button type="reset" class="btn btn-secondary">Clear form</button>
          <button type="submit" class="btn btn-primary">Run evaluation</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="script.js"></script>
