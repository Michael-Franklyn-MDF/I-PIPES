<!-- ── Add User Modal ────────────────────────────────────────────────────── -->
<div id="modal-add-user" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-user-title">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-user-title">Add New User</div>
      <button class="modal-close" id="cancel-user" aria-label="Close">✕</button>
    </div>

    <form id="form-add-user">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="e.g. Jane Mwangi" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. jane@example.org" required>
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" required>
          <option value="">Select role</option>
          <option value="admin">Admin</option>
          <option value="analyst">Policy Analyst</option>
          <option value="researcher">Researcher</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" id="cancel-user" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Add User</button>
      </div>
    </form>
  </div>
</div>
